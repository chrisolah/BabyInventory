<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <!-- Teal background -->
  <rect width="32" height="32" rx="6" fill="#1D9E75"/>
  <!-- Stem -->
  <path d="M15.5 27 C14.5 22 14 18 15 14 C15.5 11 15.5 9 15.5 7"
        stroke="white" stroke-width="2.8" stroke-linecap="round" fill="none"/>
  <!-- Bud at top -->
  <ellipse cx="15.5" cy="5" rx="2.2" ry="3" fill="white"/>
  <!-- Right leaf (upper) -->
  <ellipse cx="20" cy="12" rx="5" ry="2.2" transform="rotate(-30 20 12)" fill="white"/>
  <!-- Left leaf (lower) -->
  <ellipse cx="11" cy="18" rx="5" ry="2.2" transform="rotate(30 11 18)" fill="white"/>
</svg>
