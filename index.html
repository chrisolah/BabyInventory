    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/manifest.json" />
    <title>Sprigloop: the wardrobe app for baby clothes you'll pass on</title>
    <meta name="description" content="Track every onesie, plan every size, and pass along what your little one has outgrown to another Sprigloop family." />
    <link rel="canonical" href="https://sprigloop.com/" />
    <meta name="robots" content="index, follow" />
    <meta name="theme-color" content="#FAF7F2" />

    <!-- Open Graph -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Sprigloop" />
    <meta property="og:title" content="Sprigloop: the wardrobe app for baby clothes you'll pass on" />
    <meta property="og:description" content="Track every onesie, plan every size, and pass along what your little one has outgrown to another Sprigloop family." />
    <meta property="og:url" content="https://sprigloop.com/" />
    <meta property="og:image" content="https://sprigloop.com/og-image.png" />

    <!-- Twitter -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Sprigloop: the wardrobe app for baby clothes you'll pass on" />
    <meta name="twitter:description" content="Track every onesie, plan every size, and pass along what your little one has outgrown to another Sprigloop family." />

    <meta name="twitter:image:alt" content="Sprigloop: baby clothes, organized and shared." />
  </head>
  <body>
    <div id="root"></div>
    <!-- Take scroll restoration out of the browser's hands BEFORE React loads.
         If we wait for App.jsx's useEffect to do this, the browser may have
         already auto-restored scroll position from history on a refresh or
         back/forward, and we'd see a flash of the wrong position before our
         JS-side ScrollToTop runs. Pinning to 'manual' here means every
         navigation is owned by App.jsx's ScrollToTop component. -->
    <script>
      if ('scrollRestoration' in history) {
        history.scrollRestoration = 'manual';
      }
    </script>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
